x-logging: &aws-logging
  driver: awslogs
  options:
    awslogs-region: sa-east-1
    awslogs-group: baixou
    awslogs-create-group: "false"
    tag: "{{.Name}}"

x-shared-app: &shared-app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: app
  working_dir: /var/www
  logging: *aws-logging
  environment:
    - APP_URL=${APP_URL:-http://localhost:8000}
    - DB_CONNECTION=${DB_CONNECTION:-pgsql}
    - DB_HOST=${DB_HOST:-postgres}
    - DB_PORT=${DB_PORT:-5432}
    - DB_DATABASE=${DB_DATABASE:-baixou}
    - DB_USERNAME=${DB_USERNAME:-dev}
    - DB_PASSWORD=${DB_PASSWORD:-123}
    - MONGO_DB_DATABASE=${MONGO_DB_DATABASE:-baixou}
    - MONGO_DB_URI=mongodb://${MONGO_DB_USERNAME:-dev}:${MONGO_DB_PASSWORD:-123}@mongodb:27017/${MONGO_DB_DATABASE:-baixou}?authSource=admin
    - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
    - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
    - RABBITMQ_USER=${RABBITMQ_USER:-baixou_app}
    - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-local_dev_password}
    - LOG_CHANNEL=stderr
  volumes:
    - ../.env:/var/www/.env:ro
    - storage_data:/var/www/storage
  networks:
    - core
  depends_on:
    - postgres
    - rabbitmq

services:
  app:
    <<: *shared-app
    container_name: core_app
    restart: unless-stopped
    volumes:
      - ../.env:/var/www/.env:ro
      - storage_data:/var/www/storage
    depends_on:
      postgres:
        condition: service_started
      mongodb:
        condition: service_started
      rabbitmq-definitions:
        condition: service_completed_successfully

  queue-worker:
    <<: *shared-app
    container_name: core_queue_worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --max-time=3600
    depends_on:
      - postgres

  # scheduler:
  #   <<: *shared-app
  #   container_name: core_scheduler
  #   restart: unless-stopped
  #   command: php artisan schedule:work
  #   depends_on:
  #     rabbitmq-definitions:
  #       condition: service_completed_successfully

  rabbitmq-consumer:
    <<: *shared-app
    container_name: core_rabbitmq_consumer
    restart: unless-stopped
    command: php artisan app:consume-scrape-results
    depends_on:
      rabbitmq-definitions:
        condition: service_completed_successfully

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    container_name: core_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    logging: *aws-logging
    volumes:
      - ../:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/storage:ro
    networks:
      - core
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: core_db
    restart: unless-stopped
    logging: *aws-logging
    # ports:
    #   - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-baixou}
      POSTGRES_USER: ${DB_USERNAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core

  mongodb:
    image: mongo:9.0.4
    container_name: core_mongodb
    restart: unless-stopped
    logging: *aws-logging
    #ports:
    # - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_DATABASE:-baixou}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-123}
    volumes:
      - mongodb_data:/data/db
    networks:
      - core

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: core_rabbitmq
    restart: unless-stopped
    logging: *aws-logging
    ports:
      #- "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-baixou_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - core
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # load the RabbitMQ definitions after the service is healthy
  rabbitmq-definitions:
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-baixou_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_dev_password}
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    networks:
      - core
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        curl --fail --silent --show-error
        --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 120
        --user "$${RABBITMQ_DEFAULT_USER}:$${RABBITMQ_DEFAULT_PASS}"
        -H "Content-Type: application/json"
        -X POST
        --data-binary @/definitions.json
        http://rabbitmq:15672/api/definitions

  # Python scrapper
  scrapper:
    build: https://github.com/Baixou-Fatec-Semestre-6/scrapping.git#feat/scrapping-rabbitmq-validacoes
    container_name: scrapper
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-baixou_app}:${RABBITMQ_PASSWORD:-local_dev_password}@rabbitmq:5672/%2F
    networks:
      - core
    depends_on:
      rabbitmq-definitions:
        condition: service_completed_successfully

  # Mailpit service for capturing emails sent by the application during development
  mailpit:
    image: axllent/mailpit:latest
    container_name: core_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      #- "1025:1025"
    networks:
      - core

networks:
  core:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  mongodb_data:
  storage_data:
